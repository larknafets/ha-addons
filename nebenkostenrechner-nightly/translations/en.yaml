---
configuration:
  vermieter_password:
    name: Landlord Password
    description: >-
      Optionally protect access with a password. The landlord sees and
      may do everything. Without a password the app is open and everyone
      is landlord.
  mieter_password:
    name: Tenant Password
    description: >-
      Optional, one login for the tenant. What the tenant sees and does
      is set by the landlord in the master data under Berechtigungen
      (permissions). Only works together with the landlord password.
      Leave empty (default) for no tenant login.
