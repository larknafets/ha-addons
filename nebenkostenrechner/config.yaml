name: Nebenkosten
version: "0.8.1"
slug: nebenkostenrechner
description: Monatliche Nebenkostenabrechnung (Strom, Heizung/Warmwasser, Wasser) für ein Zweifamilienhaus mit Wärmepumpe und PV-Anlage
url: https://github.com/larknafets/nebenkostenrechner
arch:
  - amd64
  - aarch64
init: false
image: ghcr.io/larknafets/nebenkostenrechner
map:
  - type: addon_config
    read_only: false
environment:
  DB_PATH: /config/nebenkosten.db
ingress: true
ingress_port: 8080
panel_title: "Nebenkosten"
panel_icon: mdi:cash-multiple
ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: "Read-only Widget-Routen (/widget/jahressumme/{entity}, /widget/verbrauchswerte/{entity}) für Lovelace Webpage-Card-Iframes, ohne Login - siehe DOCS.md"
