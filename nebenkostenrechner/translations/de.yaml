---
configuration:
  login_password:
    name: Login-Kennwort
    description: >-
      Optional per Kennwort absichern. Ohne Kennwort sehen Besucher nur
      eingeschränkte, lesende Ansichten; nach Login sind alle
      Bearbeitungsfunktionen freigeschaltet. Leer lassen (Standard)
      deaktiviert den Login komplett.
